# @package _global_

defaults:
- override /model: nnp

run:
  work_dir: ${hydra:runtime.cwd}
  data_dir: ${run.work_dir}/data
  path: ${run.work_dir}/runs
  experiment: default
  id: train_1
  ckpt_path:
globals:
  model_path: best_model
  cutoff: 5.0
  lr: 0.0005
  property: V_BuRNN
  aggregation: sum
trainer:
  _target_: pytorch_lightning.Trainer
  devices: 1
  min_epochs: 100
  max_epochs: 500
  enable_model_summary: true
  profiler:
  gradient_clip_val:
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  fast_dev_run: false
  overfit_batches: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  detect_anomaly: false
  precision: 32
  accelerator: auto
  num_nodes: 1
  deterministic: false
  inference_mode: false
callbacks:
  model_checkpoint:
    _target_: schnetpack.train.ModelCheckpoint
    monitor: val_loss
    save_top_k: 1
    save_last: true
    mode: min
    verbose: false
    dirpath: checkpoints/
    filename: '{epoch:02d}'
    model_path: ${globals.model_path}
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 200
    mode: min
    min_delta: 0.0
    check_on_train_epoch_end: false
  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch
  ema:
    _target_: schnetpack.train.ExponentialMovingAverage
    decay: 0.995
  lr_reset:
    _target_: schnetpack.train.LearningRateReset
    reset: false
    new_lr: 0.0003
task:
  _target_: schnetpack.task.FieldRegularizedAtomisticTask
  outputs:
  - _target_: schnetpack.task.ModelOutput
    name: ${globals.property}
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.05

  - _target_: schnetpack.task.ModelOutput
    name: F_BuRNN
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.70

  - _target_: schnetpack.task.ModelOutput
    name: charges
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.15

  - _target_: schnetpack.task.ModelOutput
    name: mbis_valence_widths
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.10

  field_regularization:
    enabled: true
    phi_key: phi_static
    phi_aug_key: phi_static_aug
    mode: random
    phi_std: 300.0
    phi_clip: 1000.0
    center_phi: true
    w_bound: 0.01
    w_dq: 0.001
    w_sensitivity: 0.0
    charges_key: charges
    charge_bounds:
      1: 0.8
      8: 1.5
      26: 3.2
      default: 2.0

  warmup_steps: 0
  optimizer_cls: torch.optim.AdamW
  optimizer_args:
    lr: ${globals.lr}
    weight_decay: 0.0
  scheduler_cls: schnetpack.train.ReduceLROnPlateau
  scheduler_monitor: val_loss
  scheduler_args:
    mode: min
    factor: 0.5
    patience: 75
    threshold: 0.0
    threshold_mode: rel
    cooldown: 10
    min_lr: 0.0
    smoothing_factor: 0.0
model:
  representation:
    radial_basis:
      _target_: schnetpack.nn.radial.GaussianRBF
      n_rbf: 20
      cutoff: ${globals.cutoff}
    _target_: schnetpack.representation.PaiNN
    n_atom_basis: 128
    n_interactions: 3
    shared_interactions: false
    shared_filters: false
    cutoff_fn:
      _target_: schnetpack.nn.cutoff.CosineCutoff
      cutoff: ${globals.cutoff}

  _target_: schnetpack.model.NeuralNetworkPotential

  input_modules:
  - _target_: schnetpack.atomistic.PairwiseDistances

  output_modules:
  - _target_: schnetpack.atomistic.Atomwise
    output_key: ${globals.property}
    n_in: ${model.representation.n_atom_basis}
    aggregation_mode: ${globals.aggregation}

  - _target_: schnetpack.atomistic.Forces
    energy_key: ${globals.property}
    force_key: F_BuRNN

  - _target_: schnetpack.atomistic.EMLEStaticParamHead
    n_in: ${model.representation.n_atom_basis}
    widths_key: mbis_valence_widths
    chi_key: chi_emle
    width_min: 0.05
    width_max: 3.5

  - _target_: schnetpack.atomistic.EMLEQEqStatic
    widths_key: mbis_valence_widths
    chi_key: chi_emle
    charges_key: charges
    sigma_qeq_key: sigma_qeq
    qcore_key: q_core
    qval_key: q_val
    hardness_key: Jii_qeq
    aqeq_key: a_qeq
    phi_key: phi_static
    qcore_table:
      1: 1.0
      8: 6.35
      26: 4.46
    init_a_qeq: 1.0
    learn_a_qeq: true
    a_qeq_positive: true
    correct_charges: true
    offdiag_cutoff: 10.0

  postprocessors:
  - _target_: schnetpack.transform.CastTo64
  - _target_: schnetpack.transform.AddOffsets
    property: ${globals.property}
    add_mean: true
    add_atomrefs: false
data:
  _target_: schnetpack.data.AtomsDataModule
  datapath: /pool/m_gillhofer/phd/BuRNN_dqdr/FeIII_6H2O_Qeq/AS_0/DB_fromSQ_valenceQ.db
  data_workdir:
  property_units: {'V_BuRNN': 'kJ/mol', 'F_BuRNN': 'kJ/mol/Ang', 'charges': 1.0,'mbis_valence_widths': 1.0}
  batch_size: 4
  num_train: 692
  num_val: 130
  num_workers: 20
  num_val_workers:
  num_test_workers:
  train_sampler_cls:
  transforms:
  - _target_: schnetpack.transform.RemoveOffsets
    property: ${globals.property}
    remove_atomrefs: false
    remove_mean: true
  - _target_: schnetpack.transform.ASENeighborList
    cutoff: ${globals.cutoff}
  - _target_: schnetpack.transform.CastTo32
logger:
  tensorboard:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: tensorboard/
    name: default
print_config: true

