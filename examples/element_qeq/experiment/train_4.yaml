# @package _global_

defaults:
- override /model: nnp

seed: 4

run:
  work_dir: ${hydra:runtime.cwd}
  data_dir: ${run.work_dir}/data
  path: ${run.work_dir}/runs
  experiment: element_qeq
  id: element_qeq_train_4
  ckpt_path:
globals:
  model_path: best_model
  cutoff: 5.0
  lr: 0.0005
  property: V_BuRNN
  aggregation: sum
trainer:
  _target_: pytorch_lightning.Trainer
  devices: 1
  min_epochs: 100
  max_epochs: 500
  enable_model_summary: true
  profiler:
  gradient_clip_val:
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  fast_dev_run: false
  overfit_batches: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  detect_anomaly: false
  precision: 32
  accelerator: auto
  num_nodes: 1
  deterministic: false
  inference_mode: false
callbacks:
  model_checkpoint:
    _target_: schnetpack.train.ModelCheckpoint
    monitor: val_loss
    save_top_k: 1
    save_last: true
    mode: min
    verbose: false
    dirpath: checkpoints/
    filename: '{epoch:02d}'
    model_path: ${globals.model_path}
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 200
    mode: min
    min_delta: 0.0
    check_on_train_epoch_end: false
  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch
  ema:
    _target_: schnetpack.train.ExponentialMovingAverage
    decay: 0.995
  lr_reset:
    _target_: schnetpack.train.LearningRateReset
    reset: false
    new_lr: 0.0003
task:
  _target_: schnetpack.AtomisticTask
  outputs:
  - _target_: schnetpack.task.ModelOutput
    name: ${globals.property}
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.05

  - _target_: schnetpack.task.ModelOutput
    name: F_BuRNN
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.70

  - _target_: schnetpack.task.ModelOutput
    name: charges
    loss_fn:
      _target_: torch.nn.MSELoss
    metrics:
      mae:
        _target_: torchmetrics.regression.MeanAbsoluteError
      rmse:
        _target_: torchmetrics.regression.MeanSquaredError
        squared: false
    loss_weight: 0.15

  warmup_steps: 0
  optimizer_cls: torch.optim.AdamW
  optimizer_args:
    lr: ${globals.lr}
    weight_decay: 0.0
  scheduler_cls: schnetpack.train.ReduceLROnPlateau
  scheduler_monitor: val_loss
  scheduler_args:
    mode: min
    factor: 0.5
    patience: 75
    threshold: 0.0
    threshold_mode: rel
    cooldown: 10
    min_lr: 0.0
    smoothing_factor: 0.0
model:
  representation:
    radial_basis:
      _target_: schnetpack.nn.radial.GaussianRBF
      n_rbf: 20
      cutoff: ${globals.cutoff}
    _target_: schnetpack.representation.PaiNN
    n_atom_basis: 128
    n_interactions: 3
    shared_interactions: false
    shared_filters: false
    cutoff_fn:
      _target_: schnetpack.nn.cutoff.CosineCutoff
      cutoff: ${globals.cutoff}
    nuclear_embedding:
      _target_: schnetpack.nn.embedding.NuclearEmbedding
      max_z: 101
      num_features: 128
    electronic_embeddings:
    - _target_: schnetpack.nn.embedding.ElectronicEmbedding
      property_key: spin_multiplicity
      num_features: 128
      is_charged: false
    - _target_: schnetpack.nn.embedding.ElectronicEmbedding
      property_key: total_charge
      num_features: 128
      is_charged: true
  _target_: schnetpack.model.NeuralNetworkPotential

  input_modules:
  - _target_: schnetpack.atomistic.PairwiseDistances

  output_modules:
  - _target_: schnetpack.atomistic.Atomwise
    output_key: ${globals.property}
    n_in: ${model.representation.n_atom_basis}
    aggregation_mode: ${globals.aggregation}

  - _target_: schnetpack.atomistic.Forces
    energy_key: ${globals.property}
    force_key: F_BuRNN

  # Charges are an independent auxiliary fit; energies/forces use Atomwise.
  # Normalized QEq units (gamma=1); external kJ/mol/e fields need conversion.
  - _target_: schnetpack.atomistic.ElementQEqCharges
    charges_key: charges
    chi_key: chi_qeq
    hardness_key: Jii_qeq
    max_z: 8
    use_offdiag: true
    add_gaussian_self: true
    offdiag_cutoff: null
    init_chi: 0.0
    init_logJ: 0.0
    eps_hardness: 0.1
    init_width: 1.0
    learn_widths: false
    init_gamma: 1.0
    learn_gamma: false
    gamma_positive: true
    correct_charges: true
    phi_key: null

  postprocessors:
  - _target_: schnetpack.transform.CastTo64
  - _target_: schnetpack.transform.AddOffsets
    property: ${globals.property}
    add_mean: true
    add_atomrefs: false
data:
  _target_: schnetpack.data.AtomsDataModule
  datapath: /pool/m_gillhofer/phd/BuRNN_dqdr/MeOH_H2O/training_QEq/MeOH_H2O.db
  data_workdir:
  property_units: {'V_BuRNN': 'kJ/mol', 'F_BuRNN': 'kJ/mol/Ang', 'charges': 1.0}
  batch_size: 4
  num_train: 3799
  num_val: 712
  num_workers: 20
  num_val_workers:
  num_test_workers:
  train_sampler_cls:
  transforms:
  - _target_: schnetpack.transform.RemoveOffsets
    property: ${globals.property}
    remove_atomrefs: false
    remove_mean: true
  - _target_: schnetpack.transform.ASENeighborList
    cutoff: ${globals.cutoff}
  - _target_: schnetpack.transform.CastTo32
logger:
  tensorboard:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: tensorboard/
    name: default
print_config: true
